<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agent Mail">
<meta name="theme-color" content="#f59e0b">
<meta name="description" content="Gestionnaire Gmail intelligent propulsé par l'IA">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>Agent Gmail IA</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070d;--s:#0e0e17;--s2:#0b0b13;--bd:#181828;--bd2:#222235;
  --am:#f59e0b;--amd:#6b4500;--amf:#100d02;
  --gn:#10b981;--gnd:#064e35;--gnf:#021510;
  --rd:#f87171;--rdd:#5a1a1a;
  --or:#fb923c;--ord:#7c3a0a;
  --bl:#60a5fa;--bld:#1e3a6e;
  --tx:#e2e8f0;--mu:#374151;--mu2:#6b7280;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  background:var(--bg);color:var(--tx);
  font-family:'JetBrains Mono',monospace;
  display:flex;flex-direction:column;
  /* Safe area for notch phones */
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}

/* HEADER */
.header{
  background:var(--s);border-bottom:1px solid var(--bd);
  padding:12px 16px;display:flex;align-items:center;
  justify-content:space-between;flex-shrink:0;
}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;
  background:linear-gradient(135deg,#fff 30%,var(--am));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.srv{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--mu2);}
.sdot{width:6px;height:6px;border-radius:50%;}
.sdot.ok{background:var(--gn);}.sdot.err{background:var(--rd);}.sdot.spin{background:var(--am);animation:pl 1s infinite;}
@keyframes pl{0%,100%{opacity:.3}50%{opacity:1}}

/* STATS BAR */
.stats{
  display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--s2);border-bottom:1px solid var(--bd);
  flex-shrink:0;
}
.stat{padding:8px 4px;text-align:center;border-right:1px solid var(--bd);}
.stat:last-child{border:none;}
.stat-v{font-size:16px;font-weight:700;display:block;margin-bottom:1px;}
.stat-l{font-size:8px;color:var(--mu2);letter-spacing:.5px;text-transform:uppercase;}

/* QUICK ACTIONS */
.quick-actions{
  display:flex;gap:6px;padding:10px 12px;
  overflow-x:auto;flex-shrink:0;
  border-bottom:1px solid var(--bd);
  scrollbar-width:none;
}
.quick-actions::-webkit-scrollbar{display:none;}
.qa{
  flex-shrink:0;background:var(--s);border:1px solid var(--bd2);
  color:var(--mu2);font-family:'JetBrains Mono',monospace;
  font-size:10px;padding:6px 12px;border-radius:20px;
  cursor:pointer;white-space:nowrap;transition:all .15s;
  -webkit-user-select:none;user-select:none;
}
.qa:active{border-color:var(--am);color:var(--am);background:var(--amf);}

/* FILTERS */
.filters{
  display:flex;gap:5px;padding:8px 12px;
  overflow-x:auto;flex-shrink:0;
  scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none;}
.f{
  flex-shrink:0;background:transparent;border:1px solid var(--bd2);
  color:var(--mu2);font-family:'JetBrains Mono',monospace;
  font-size:10px;padding:4px 10px;border-radius:10px;cursor:pointer;
  transition:all .15s;-webkit-user-select:none;user-select:none;
}
.f.act{border-color:var(--am);color:var(--am);background:var(--amf);}

/* CHAT AREA */
.chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch;}

/* Empty */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;color:var(--mu2);padding:20px;}
.empty-icon{font-size:48px;margin-bottom:4px;}
.empty h2{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--tx);}
.empty p{font-size:11px;line-height:1.7;max-width:280px;}

/* Messages */
.msg{display:flex;flex-direction:column;gap:6px;animation:fu .2s ease;}
@keyframes fu{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.user-msg{
  align-self:flex-end;max-width:85%;
  background:var(--amf);border:1px solid var(--amd);
  border-radius:12px 12px 2px 12px;
  padding:10px 14px;font-size:13px;line-height:1.5;color:#fef3c7;
}
.user-msg::before{content:'Vous';display:block;font-size:9px;letter-spacing:1px;color:var(--am);margin-bottom:3px;}
.agent-block{align-self:flex-start;width:100%;display:flex;flex-direction:column;gap:5px;}
.agent-lbl{font-size:9px;letter-spacing:1px;color:var(--mu);text-transform:uppercase;margin-bottom:1px;}

/* Cards */
.card{background:var(--s);border:1px solid var(--bd2);border-radius:8px;overflow:hidden;}
.card-head{display:flex;align-items:center;gap:7px;padding:10px 12px;cursor:pointer;-webkit-user-select:none;user-select:none;}
.card-icon{font-size:14px;}
.card-title{font-size:10px;letter-spacing:.5px;text-transform:uppercase;flex:1;}
.card.em .card-title{color:var(--or);}
.card.ac .card-title{color:var(--gn);}
.card.dl .card-title{color:var(--rd);}
.card.er .card-title{color:var(--rd);}
.card-tog{color:var(--mu);font-size:10px;}
.card-body{padding:0 12px 10px;font-size:12px;line-height:1.7;color:var(--mu2);white-space:pre-wrap;word-break:break-word;max-height:250px;overflow-y:auto;}
.card-body.hide{display:none;}

/* Email list */
.elist{display:flex;flex-direction:column;gap:4px;}
.eitem{
  background:var(--s2);border:1px solid var(--bd2);border-radius:6px;
  padding:10px;display:flex;align-items:flex-start;gap:8px;
  cursor:pointer;transition:border-color .15s;
}
.eitem:active{border-color:var(--am);}
.eitem.sel{border-color:#dc2626;background:rgba(220,38,38,.08);}
.echk{width:16px;height:16px;border:1px solid var(--bd2);border-radius:4px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:10px;}
.eitem.sel .echk{background:#dc2626;border-color:#dc2626;color:#fff;}
.einfo{flex:1;min-width:0;}
.efrom{font-size:11px;color:var(--or);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.esubj{font-size:12px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.eprev{font-size:10px;color:var(--mu2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
.etag{font-size:9px;padding:1px 5px;border-radius:6px;margin-top:3px;display:inline-block;}
.etag.u{background:rgba(96,165,250,.15);color:var(--bl);}

/* Mass action bar */
.mass-bar{
  display:flex;gap:6px;padding:8px 0 2px;flex-wrap:wrap;
}
.mabtn{
  font-family:'Syne',sans-serif;font-weight:700;font-size:9px;
  letter-spacing:1px;text-transform:uppercase;border:none;
  padding:7px 12px;border-radius:6px;cursor:pointer;
  -webkit-user-select:none;user-select:none;
}
.mabtn.rd{background:var(--rd);color:#000;}
.mabtn.gn{background:var(--gn);color:#000;}
.mabtn.or{background:var(--or);color:#000;}
.mabtn.gh{background:transparent;border:1px solid var(--bd2);color:var(--mu2);}

/* Confirm */
.conf{border:1px solid;border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;}
.conf.dc{border-color:#7f1d1d;background:rgba(220,38,38,.06);}
.conf.ec{border-color:var(--rdd);background:rgba(248,113,113,.04);}
.conf.cc{border-color:var(--gnd);background:var(--gnf);}
.ctit{font-size:10px;letter-spacing:1px;text-transform:uppercase;}
.conf.dc .ctit,.conf.ec .ctit{color:var(--rd);}
.conf.cc .ctit{color:var(--gn);}
.cdet{font-size:12px;line-height:1.7;color:var(--mu2);}
.cdet strong{color:var(--tx);}
.cbtns{display:flex;gap:6px;flex-wrap:wrap;}
.cbtn{font-family:'Syne',sans-serif;font-weight:700;font-size:10px;letter-spacing:1px;text-transform:uppercase;border:none;padding:9px 14px;border-radius:6px;cursor:pointer;-webkit-user-select:none;user-select:none;}
.cbtn.rd{background:var(--rd);color:#000;}
.cbtn.gn{background:var(--gn);color:#000;}
.cbtn.no{background:transparent;border:1px solid var(--bd2);color:var(--mu2);}

/* Answer */
.ans{background:var(--s);border:1px solid var(--amd);border-radius:8px;padding:12px;font-size:13px;line-height:1.8;color:var(--tx);white-space:pre-wrap;word-break:break-word;}

/* Thinking */
.think{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--s2);border:1px solid var(--bd2);border-radius:8px;font-size:11px;color:var(--mu2);}
.dots span{display:inline-block;animation:bl 1.2s infinite;}
.dots span:nth-child(2){animation-delay:.2s;}.dots span:nth-child(3){animation-delay:.4s;}
@keyframes bl{0%,100%{opacity:.2}50%{opacity:1}}

/* BOTTOM INPUT BAR */
.input-bar{
  background:var(--s);border-top:1px solid var(--bd);
  padding:10px 12px;flex-shrink:0;
  padding-bottom:max(10px, env(safe-area-inset-bottom));
}
.input-row{display:flex;gap:8px;align-items:flex-end;}
#inp{
  flex:1;background:var(--bg);border:1px solid var(--bd2);
  border-radius:20px;color:var(--tx);
  font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.5;
  padding:10px 16px;resize:none;min-height:42px;max-height:100px;
  outline:none;transition:border-color .2s;overflow-y:auto;
}
#inp:focus{border-color:var(--amd);}
#inp::placeholder{color:var(--mu);}
.sbtn{
  background:var(--am);color:#000;border:none;border-radius:50%;
  width:42px;height:42px;font-size:18px;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  -webkit-user-select:none;user-select:none;
}
.sbtn:active{background:#fbbf24;}
.sbtn:disabled{opacity:.35;}

::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px;}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">📧 Agent Gmail</div>
  <div class="srv"><div class="sdot spin" id="sdot"></div><span id="stxt">Connexion...</span></div>
</div>

<!-- STATS -->
<div class="stats">
  <div class="stat"><span class="stat-v" id="s-total" style="color:var(--am)">—</span><span class="stat-l">Total</span></div>
  <div class="stat"><span class="stat-v" id="s-unread" style="color:var(--bl)">—</span><span class="stat-l">Non lus</span></div>
  <div class="stat"><span class="stat-v" id="s-threads" style="color:var(--pu,#a78bfa)">—</span><span class="stat-l">Fils</span></div>
  <div class="stat"><span class="stat-v" id="s-email" style="color:var(--gn);font-size:10px">—</span><span class="stat-l">Compte</span></div>
</div>

<!-- QUICK ACTIONS -->
<div class="quick-actions">
  <button class="qa" onclick="qs(this)">📬 Mes 20 derniers</button>
  <button class="qa" onclick="qs(this)">🔵 Non lus</button>
  <button class="qa" onclick="qs(this)">⭐ Favoris</button>
  <button class="qa" onclick="qs(this)">🗑️ Supprimer FDJ</button>
  <button class="qa" onclick="qs(this)">🗑️ Supprimer Sephora</button>
  <button class="qa" onclick="qs(this)">📦 Archiver les lus</button>
  <button class="qa" onclick="qs(this)">✅ Tout marquer lu</button>
  <button class="qa" onclick="qs(this)">🗑️ Vider ma boîte</button>
</div>

<!-- CHAT -->
<div class="chat" id="chat">
  <div class="empty" id="emptyState">
    <div class="empty-icon">📬</div>
    <h2>Agent Gmail</h2>
    <p>Gère ta boîte mail en langage naturel. Dis-moi ce que tu veux faire.</p>
  </div>
</div>

<!-- INPUT BAR -->
<div class="input-bar">
  <div class="input-row">
    <textarea id="inp" placeholder="Dis-moi ce que tu veux faire..." rows="1"></textarea>
    <button class="sbtn" id="sendBtn" onclick="send()">⬆</button>
  </div>
</div>

<script>
// Register service worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').then(function(reg){
    console.log('SW registered');
  }).catch(function(e){ console.log('SW error', e); });
}

var convHistory = [];
var busy = false;

// Utils
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function scrollBot(){var c=document.getElementById('chat');c.scrollTop=c.scrollHeight;}
function today(){return new Date().toISOString().split('T')[0];}
function qs(btn){
  var text=btn.textContent.replace(/^[^\s]+\s/,'');
  document.getElementById('inp').value=text;
  send();
}

// Auto-resize + enter
document.getElementById('inp').addEventListener('input',function(){
  this.style.height='auto';
  this.style.height=Math.min(this.scrollHeight,100)+'px';
});
document.getElementById('inp').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
});

// UI helpers
function makeCard(type,icon,title,body,collapsed){
  var el=document.createElement('div');el.className='card '+type;
  el.innerHTML='<div class="card-head" onclick="tog(this)">'+
    '<span class="card-icon">'+icon+'</span>'+
    '<span class="card-title">'+title+'</span>'+
    '<span class="card-tog" data-t>'+(collapsed?'▼':'▲')+'</span></div>'+
    '<div class="card-body'+(collapsed?' hide':'')+'">'+esc(body)+'</div>';
  return el;
}
function tog(h){
  var b=h.nextElementSibling;b.classList.toggle('hide');
  h.querySelector('[data-t]').textContent=b.classList.contains('hide')?'▼':'▲';
}
function makeThink(msg){
  var el=document.createElement('div');el.className='think';
  el.innerHTML='<span>🔄</span><span>'+msg+'</span><span class="dots"><span>.</span><span>.</span><span>.</span></span>';
  return el;
}
function makeConf(type,title,detail,yesLabel,yesCls,onYes,onNo){
  var el=document.createElement('div');el.className='conf '+type;
  el.innerHTML='<div class="ctit">'+title+'</div><div class="cdet">'+detail+'</div>'+
    '<div class="cbtns">'+
    '<button class="cbtn '+yesCls+'" id="cy">'+yesLabel+'</button>'+
    '<button class="cbtn no" id="cn">✕ Annuler</button></div>';
  setTimeout(function(){el.querySelector('#cy').onclick=onYes;el.querySelector('#cn').onclick=onNo;},0);
  return el;
}

// API
function api(path,method,body){
  var opts={method:method||'GET',headers:{'Content-Type':'application/json'}};
  if(body) opts.body=JSON.stringify(body);
  return fetch(path,opts).then(function(r){
    return r.json().then(function(d){
      if(!r.ok) throw new Error(d.error||d.message||'Erreur '+r.status);
      return d;
    });
  });
}
function callAI(system,msgs){
  return api('/api/chat','POST',{model:'llama-3.1-8b-instant',max_tokens:800,system:system,messages:msgs})
    .then(function(d){return(d.content||[]).filter(function(b){return b.type==='text';}).map(function(b){return b.text;}).join('\n');});
}

function detectIntent(goal){
  var now=new Date();
  var today2=now.toLocaleDateString('fr-FR',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  var time=now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  return callAI(
    'Aujourd\'hui: '+today2+', '+time+'. Réponds UNIQUEMENT avec un JSON valide.\n'+
    'Actions:\n'+
    '{"action":"list_emails","count":20,"query":""}\n'+
    '{"action":"delete_query","query":"from:fdj.fr","label":"FDJ"}\n'+
    '{"action":"delete_all"}\n'+
    '{"action":"mark_query","query":"is:read","mark":"archive"}\n'+
    '{"action":"send_email","to":"email","subject":"sujet","body":"corps"}\n'+
    '{"action":"direct","response":"réponse"}\n'+
    'Pour supprimer un expéditeur → delete_query avec query="from:domaine.com".\n'+
    'Pour vider la boîte → delete_all.\n'+
    'Pour non lus → query="is:unread". Pour favoris → query="is:starred".\n'+
    'Pour archiver/marquer lus en masse → mark_query.',
    convHistory.concat([{role:'user',content:goal}])
  ).then(function(raw){
    try{return JSON.parse(raw.replace(/```json|```/g,'').trim());}
    catch(e){return {action:'direct',response:'Je n\'ai pas compris, reformule ?'};}
  });
}

function renderEmailList(emails,ab,onAction){
  var wrap=document.createElement('div');
  var list=document.createElement('div');list.className='elist';
  emails.forEach(function(email,i){
    var item=document.createElement('div');item.className='eitem';item.dataset.idx=i;
    item.innerHTML='<div class="echk">✓</div><div class="einfo">'+
      '<div class="efrom">'+esc(email.from)+'</div>'+
      '<div class="esubj">'+esc(email.subject)+'</div>'+
      '<div class="eprev">'+esc(email.preview)+'</div>'+
      (email.unread?'<span class="etag u">Non lu</span>':'')+
    '</div>';
    item.onclick=function(){item.classList.toggle('sel');};
    list.appendChild(item);
  });
  wrap.appendChild(list);
  var mass=document.createElement('div');mass.className='mass-bar';
  function mkBtn(lbl,cls,fn){
    var b=document.createElement('button');b.className='mabtn '+cls;b.textContent=lbl;b.onclick=fn;return b;
  }
  mass.appendChild(mkBtn('Tout','gh',function(){list.querySelectorAll('.eitem').forEach(function(el){el.classList.add('sel');});}));
  mass.appendChild(mkBtn('Aucun','gh',function(){list.querySelectorAll('.eitem').forEach(function(el){el.classList.remove('sel');});}));
  mass.appendChild(mkBtn('🗑️ Suppr.','rd',function(){
    var sel=Array.from(list.querySelectorAll('.eitem.sel')).map(function(el){return emails[parseInt(el.dataset.idx)].id;});
    if(!sel.length){alert('Aucun email sélectionné');return;}
    if(onAction) onAction('delete',sel);
  }));
  mass.appendChild(mkBtn('✅ Lu','gn',function(){
    var sel=Array.from(list.querySelectorAll('.eitem.sel')).map(function(el){return emails[parseInt(el.dataset.idx)].id;});
    if(!sel.length){alert('Aucun email sélectionné');return;}
    if(onAction) onAction('mark_read',sel);
  }));
  mass.appendChild(mkBtn('📦 Archiver','or',function(){
    var sel=Array.from(list.querySelectorAll('.eitem.sel')).map(function(el){return emails[parseInt(el.dataset.idx)].id;});
    if(!sel.length){alert('Aucun email sélectionné');return;}
    if(onAction) onAction('archive',sel);
  }));
  wrap.appendChild(mass);
  return wrap;
}

// Main send
function send(){
  if(busy)return;
  var inp=document.getElementById('inp');
  var goal=inp.value.trim();if(!goal)return;
  var es=document.getElementById('emptyState');if(es)es.remove();
  inp.value='';inp.style.height='auto';
  busy=true;document.getElementById('sendBtn').disabled=true;
  convHistory.push({role:'user',content:goal});

  var ex=document.createElement('div');ex.className='msg';
  var ub=document.createElement('div');ub.className='user-msg';ub.textContent=goal;ex.appendChild(ub);
  var ab=document.createElement('div');ab.className='agent-block';
  var al=document.createElement('div');al.className='agent-lbl';al.textContent='// Agent';ab.appendChild(al);
  ex.appendChild(ab);document.getElementById('chat').appendChild(ex);scrollBot();

  function done(ans){
    if(ans) convHistory.push({role:'assistant',content:ans});
    busy=false;document.getElementById('sendBtn').disabled=false;scrollBot();
  }

  var it=makeThink('Analyse...');ab.appendChild(it);scrollBot();
  detectIntent(goal).then(function(intent){
    it.remove();

    if(intent.action==='list_emails'){
      var rt=makeThink('Chargement emails...');ab.appendChild(rt);scrollBot();
      api('/api/gmail/list?count='+(intent.count||20)+(intent.query?'&q='+encodeURIComponent(intent.query):'')).then(function(data){
        rt.remove();
        if(!data.emails||!data.emails.length){
          var a=document.createElement('div');a.className='ans';a.textContent='Aucun email trouvé.';ab.appendChild(a);done('');return;
        }
        var card=document.createElement('div');card.className='card em';
        var ch=document.createElement('div');ch.className='card-head';
        ch.innerHTML='<span class="card-icon">📧</span><span class="card-title">'+data.emails.length+' email(s)'+(intent.query?' — '+intent.query:'')+'</span>';
        card.appendChild(ch);
        var cb=document.createElement('div');cb.className='card-body';
        cb.appendChild(renderEmailList(data.emails,ab,function(action,ids){
          var dt=makeThink('Action en cours...');ab.appendChild(dt);scrollBot();
          var call;
          if(action==='delete') call=api('/api/gmail/delete','POST',{ids:ids});
          else if(action==='mark_read') call=api('/api/gmail/mark','POST',{ids:ids,action:'read'});
          else call=api('/api/gmail/mark','POST',{ids:ids,action:'archive'});
          call.then(function(r){
            dt.remove();
            var a=document.createElement('div');a.className='ans';a.textContent=r.message;ab.appendChild(a);scrollBot();
          }).catch(function(e){dt.remove();ab.appendChild(makeCard('er','❌','Erreur',e.message,false));scrollBot();});
        }));
        card.appendChild(cb);ab.appendChild(card);done(data.emails.length+' emails chargés.');
      }).catch(function(e){rt.remove();ab.appendChild(makeCard('er','❌','Erreur',e.message,false));done('');});

    } else if(intent.action==='delete_query'){
      var sender=intent.label||intent.query;
      var rt2=makeThink('Recherche : '+sender);ab.appendChild(rt2);scrollBot();
      api('/api/gmail/delete-query','POST',{query:intent.query,preview_only:true}).then(function(prev){
        rt2.remove();
        if(prev.total===0){var a=document.createElement('div');a.className='ans';a.textContent='Aucun email trouvé pour : '+sender;ab.appendChild(a);done('');return;}
        var prevHtml='<strong>Filtre :</strong> '+esc(intent.query)+'<br><strong>Trouvés :</strong> '+prev.total+'<br><br>';
        prevHtml+=prev.preview.slice(0,4).map(function(e){return '<div style="padding:3px 0;border-bottom:1px solid var(--bd2);font-size:11px"><span style="color:var(--or)">'+esc(e.from)+'</span><br>'+esc(e.subject)+'</div>';}).join('');
        if(prev.total>4) prevHtml+='<div style="color:var(--mu2);font-size:10px;margin-top:3px">...et '+(prev.total-4)+' autre(s)</div>';
        var conf=makeConf('dc','🗑️ Confirmer la suppression',prevHtml,'🗑️ Supprimer '+prev.total+' email(s)','rd',
          function(){
            conf.remove();var dt=makeThink('Suppression...');ab.appendChild(dt);scrollBot();
            api('/api/gmail/delete-query','POST',{query:intent.query,preview_only:false}).then(function(r){
              dt.remove();ab.appendChild(makeCard('dl','🗑️',r.deleted+' supprimés','Emails de "'+sender+'" supprimés.',false));
              var a=document.createElement('div');a.className='ans';a.textContent=r.message;ab.appendChild(a);done(r.message);
            }).catch(function(e){dt.remove();ab.appendChild(makeCard('er','❌','Erreur',e.message,false));done('');});
          },
          function(){conf.remove();var a=document.createElement('div');a.className='ans';a.textContent='Annulé.';ab.appendChild(a);done('Annulé.');}
        );
        ab.appendChild(conf);scrollBot();
      }).catch(function(e){rt2.remove();ab.appendChild(makeCard('er','❌','Erreur',e.message,false));done('');});

    } else if(intent.action==='delete_all'){
      var conf2=makeConf('dc','⚠️ Vider toute la boîte',
        '⚠️ <strong>Attention !</strong> Tous les emails seront supprimés.',
        '⚠️ Oui, vider','rd',
        function(){
          conf2.remove();var dt=makeThink('Suppression en cours...');ab.appendChild(dt);scrollBot();
          api('/api/gmail/delete-query','POST',{query:'in:inbox',preview_only:false}).then(function(r){
            dt.remove();ab.appendChild(makeCard('dl','🗑️',r.deleted+' supprimés','Boîte vidée.',false));
            var a=document.createElement('div');a.className='ans';a.textContent=r.message;ab.appendChild(a);done(r.message);
          }).catch(function(e){dt.remove();ab.appendChild(makeCard('er','❌','Erreur',e.message,false));done('');});
        },
        function(){conf2.remove();var a=document.createElement('div');a.className='ans';a.textContent='Annulé.';ab.appendChild(a);done('Annulé.');}
      );
      ab.appendChild(conf2);scrollBot();

    } else if(intent.action==='mark_query'){
      var rt3=makeThink('Recherche...');ab.appendChild(rt3);scrollBot();
      api('/api/gmail/delete-query','POST',{query:intent.query,preview_only:true}).then(function(prev2){
        rt3.remove();
        if(prev2.total===0){var a=document.createElement('div');a.className='ans';a.textContent='Aucun email trouvé.';ab.appendChild(a);done('');return;}
        var conf3=makeConf('dc','📦 Confirmer l\'action',
          '<strong>Action :</strong> '+intent.mark+'<br><strong>Emails :</strong> '+prev2.total,
          '✓ Confirmer','gn',
          function(){
            conf3.remove();var dt=makeThink('En cours...');ab.appendChild(dt);scrollBot();
            api('/api/gmail/list?count='+Math.min(prev2.total,500)+'&q='+encodeURIComponent(intent.query)).then(function(data){
              var ids=data.emails.map(function(e){return e.id;});
              return api('/api/gmail/mark','POST',{ids:ids,action:intent.mark});
            }).then(function(r){
              dt.remove();var a=document.createElement('div');a.className='ans';a.textContent=r.message;ab.appendChild(a);done(r.message);
            }).catch(function(e){dt.remove();ab.appendChild(makeCard('er','❌','Erreur',e.message,false));done('');});
          },
          function(){conf3.remove();var a=document.createElement('div');a.className='ans';a.textContent='Annulé.';ab.appendChild(a);done('Annulé.');}
        );
        ab.appendChild(conf3);scrollBot();
      }).catch(function(e){rt3.remove();ab.appendChild(makeCard('er','❌','Erreur',e.message,false));done('');});

    } else if(intent.action==='send_email'){
      var conf4=makeConf('ec','📧 Confirmer l\'envoi',
        '<strong>À :</strong> '+esc(intent.to)+'<br><strong>Sujet :</strong> '+esc(intent.subject)+'<br><br>'+esc(intent.body),
        '✓ Envoyer','rd',
        function(){
          conf4.remove();var dt=makeThink('Envoi...');ab.appendChild(dt);scrollBot();
          api('/api/gmail/send','POST',{to:intent.to,subject:intent.subject,body:intent.body}).then(function(r){
            dt.remove();ab.appendChild(makeCard('ac','✅','Email envoyé',r.message,false));done(r.message);
          }).catch(function(e){dt.remove();ab.appendChild(makeCard('er','❌','Erreur',e.message,false));done('');});
        },
        function(){conf4.remove();var a=document.createElement('div');a.className='ans';a.textContent='Annulé.';ab.appendChild(a);done('Annulé.');}
      );
      ab.appendChild(conf4);scrollBot();

    } else {
      var ans=intent.response||'';
      if(ans){var a=document.createElement('div');a.className='ans';a.textContent=ans;ab.appendChild(a);}
      done(ans);
    }
  }).catch(function(err){
    ab.appendChild(makeCard('er','❌','Erreur',err.message,false));
    convHistory.pop();busy=false;document.getElementById('sendBtn').disabled=false;
  });
}

// Health + Stats
function checkServer(){
  fetch('/health').then(function(r){return r.json();}).then(function(d){
    var dot=document.getElementById('sdot'),txt=document.getElementById('stxt');
    if(d.api_key_configured){dot.className='sdot ok';txt.textContent='Connecté ✓';}
    else{dot.className='sdot err';txt.textContent='⚠️ Clé manquante';}
  }).catch(function(){
    document.getElementById('sdot').className='sdot err';
    document.getElementById('stxt').textContent='Hors ligne';
  });
  fetch('/api/gmail/stats').then(function(r){return r.json();}).then(function(d){
    document.getElementById('s-total').textContent=d.total_messages?d.total_messages.toLocaleString():'—';
    document.getElementById('s-unread').textContent=d.unread_estimate?d.unread_estimate.toLocaleString():'—';
    document.getElementById('s-threads').textContent=d.total_threads?d.total_threads.toLocaleString():'—';
    document.getElementById('s-email').textContent=d.email||'—';
  }).catch(function(){});
}
checkServer();
</script>
